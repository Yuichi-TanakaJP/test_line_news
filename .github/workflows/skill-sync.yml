name: Skill sync

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "skill-sync.json"
      - "scripts/sync_agent_skills.py"
      - "tests/test_sync_agent_skills.py"
      - ".github/workflows/skill-sync.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "skill-sync.json"
      - "scripts/sync_agent_skills.py"
      - "tests/test_sync_agent_skills.py"
      - ".github/workflows/skill-sync.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test sync tool
        run: python -m unittest tests/test_sync_agent_skills.py -v
      - name: Check generated skills
        run: python scripts/sync_agent_skills.py
